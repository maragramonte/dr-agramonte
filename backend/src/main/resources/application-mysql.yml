spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dr_agramonte?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

logging:
  level:
    com.saludybienestar: INFO
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-please-32charsmin}
  expiration: ${JWT_EXPIRATION_MS:86400000}

