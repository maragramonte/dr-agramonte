spring:
  profiles:
    active: ${APP_PROFILE:postgres}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  error:
    include-message: always
    include-binding-errors: always
    include-exception: false
    include-stacktrace: never
  # El puerto lo fija el contenedor: 8080, detrás de Caddy (docker-compose.prod.yml).
  # PORT queda por si se despliega en un PaaS que lo imponga; en local cae a 8080.
  port: ${PORT:8080}

app:
  # Cuenta del médico. Vacías = se queda la de demostración que siembra la
  # migración V3 (dr.agramonte@example.com / Medico123!), válida solo en local:
  # su contraseña está escrita en el .sql. En el servidor son obligatorias
  # (docker-compose.prod.yml no arranca sin MEDICO_PASSWORD).
  medico:
    email: ${MEDICO_EMAIL:}
    password: ${MEDICO_PASSWORD:}
  contact:
    inbox: ${CONTACT_INBOX:}
  # Base pública de la web. Solo se usa para construir el enlace del correo de
  # activación: dentro de un correo, un enlace a localhost no sirve de nada.
  url-publica: ${APP_URL_PUBLICA:https://www.dragramonte.com}
  # Generación continua de la agenda. Las migraciones V3/V6 sembraron ~90 días desde
  # el primer arranque y no vuelven a ejecutarse, así que pasada esa ventana no
  # quedaba ningún hueco reservable. GeneradorAgendaScheduler la mantiene al día con
  # este mismo patrón (ver AgendaProperties para el resto de valores por defecto).
  agenda:
    dias-futuro: ${AGENDA_DIAS_FUTURO:90}
    cron: ${AGENDA_CRON:0 30 3 * * *}
  # Límite por IP de las rutas públicas que escriben o gastan CPU (login, contacto y
  # reserva sin cuenta). Ver RateLimitFilter.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-peticiones: ${RATE_LIMIT_MAX:10}
    ventana-segundos: ${RATE_LIMIT_VENTANA_SEGUNDOS:300}
  # Recordatorio de la víspera. Ya no es cosa de Twilio (sale también por correo y
  # por Telegram), así que tiene sus propias claves; las antiguas TWILIO_REMINDER_*
  # siguen valiendo como respaldo para no romper los .env que ya las tienen.
  recordatorio:
    horas-antes: ${RECORDATORIO_HORAS:${TWILIO_REMINDER_HOURS:24}}
    cron: ${RECORDATORIO_CRON:${TWILIO_REMINDER_CRON:0 */15 * * * *}}
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM:}
    notify-to: ${TWILIO_NOTIFY_TO:}
    channel: ${TWILIO_CHANNEL:whatsapp}
    notify-patients: ${TWILIO_NOTIFY_PATIENTS:true}
    reminder-hours-before: ${TWILIO_REMINDER_HOURS:24}
    reminder-cron: ${TWILIO_REMINDER_CRON:0 */15 * * * *}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    secret-token: ${TELEGRAM_WEBHOOK_SECRET:}

# Sin MAIL_HOST el indicador de correo falla y /actuator/health devuelve 503 (DOWN).
# El formulario de contacto sigue funcionando (solo logs) sin SMTP.
management:
  health:
    mail:
      enabled: false
