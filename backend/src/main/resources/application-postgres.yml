spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dr_agramonte}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    connect-retries: 10

logging:
  level:
    com.saludybienestar: INFO
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-please-32charsmin}
  expiration: ${JWT_EXPIRATION_MS:86400000}

