# Pull requests de actualización. Complementa al análisis semanal de seguridad.yml,
# que depende de que la NVD responda.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # El salto a Spring Boot 4 es una migración (Jackson 3, Security 7) y se hará a mano.
    # Dependabot solo propone parches y menores de la rama 3.x.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories:
      - /
      - /backend
    schedule:
      interval: monthly
