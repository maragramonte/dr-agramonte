# Análisis semanal de vulnerabilidades de las dependencias del backend con OWASP
# dependency-check. Va aparte del CI (.github/workflows/ci.yml) a propósito: el
# análisis tarda minutos, depende de un servicio externo (la NVD) y no debe
# bloquear cada push. Aquí importa el paso del tiempo, no el commit: una
# dependencia que hoy está limpia puede tener un CVE publicado la semana que viene.
#
# El umbral de fallo (CVSS >= 7) está en backend/pom.xml, en la configuración del
# plugin, para que `mvn org.owasp:dependency-check-maven:check` se comporte igual
# aquí que en local.
name: Seguridad (OWASP)

on:
  schedule:
    # Lunes a las 05:00 UTC (06:00 o 07:00 en Baleares según el horario de verano).
    - cron: '0 5 * * 1'
  # Permite lanzarlo a mano desde la pestaña Actions, p. ej. tras tocar el pom.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    # La primera ejecución descarga el histórico entero de la NVD y es la lenta;
    # las siguientes solo traen el incremento. El tope evita que un cuelgue del
    # servicio se coma los minutos de Actions.
    #
    # Eran 60 minutos y no bastaban: el run del 14/09/2026 murió cancelado justo
    # ahí, a mitad de la primera descarga. Y un job cancelado no guarda la caché,
    # así que la semana siguiente volvía a empezar de cero y a morir en el mismo
    # sitio. Se sube el tope y, sobre todo, la caché se guarda pase lo que pase
    # (ver el paso «Guardar la base de datos de la NVD»).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Sin clave de la NVD el plugin queda limitado a una petición cada ~6 s y la
      # descarga pasa de minutos a horas, así que no se intenta siquiera: el resto
      # de pasos se saltan y el run queda en verde. No es un fallo, es que todavía
      # no hay con qué analizar. Se pide gratis en
      # https://nvd.nist.gov/developers/request-an-api-key y se guarda como secreto
      # del repositorio con el nombre NVD_API_KEY.
      #
      # Queda constancia en el resumen del run para que un verde no se confunda con
      # un análisis limpio: aquí «verde» solo significa que no se ha analizado nada.
      - name: Comprobar si hay clave de la NVD
        id: clave
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "hay_clave=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin secreto NVD_API_KEY: se omite el análisis. Pide la clave en https://nvd.nist.gov/developers/request-an-api-key y añádela en Settings > Secrets and variables > Actions."
            {
              echo "### Análisis omitido"
              echo
              echo "Falta el secreto \`NVD_API_KEY\`, así que **no se han analizado las dependencias**."
              echo "La clave es gratuita: [pedirla a la NVD](https://nvd.nist.gov/developers/request-an-api-key)"
              echo "y guardarla en *Settings → Secrets and variables → Actions*."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay_clave=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar JDK 21
        if: steps.clave.outputs.hay_clave == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # La base de datos de la NVD (H2, cientos de MB) se reaprovecha entre semanas:
      # la clave lleva el run_id para que nunca acierte de pleno y siempre se guarde
      # una copia actualizada, mientras restore-keys recupera la más reciente.
      #
      # Va partido en restore + save a propósito. Con `actions/cache` entero, el
      # guardado ocurre en un post-step que NO se ejecuta si el job se cancela por
      # timeout, que es justo lo que pasaba: la descarga a medias se tiraba a la
      # basura cada lunes. Separado, el guardado es un paso normal con `always()`
      # y conserva lo descargado aunque el análisis se quede a medias, de modo que
      # el run siguiente arranca desde ahí en vez de desde cero.
      - name: Reutilizar la base de datos de la NVD
        if: steps.clave.outputs.hay_clave == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # La clave viaja por variable de entorno, no por -DnvdApiKey=: el propio
      # plugin advierte de que el parámetro directo puede acabar en los logs de
      # depuración de Maven (GHSA-qqhq-8r2c-c3f5).
      #
      # El analizador de OSS Index queda desactivado: sin cuenta de Sonatype
      # responde 429 de forma intermitente y ensuciaría el resultado con fallos
      # que no son vulnerabilidades. La NVD sola ya cubre los CVE.
      - name: Analizar las dependencias
        if: steps.clave.outputs.hay_clave == 'true'
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DdataDirectory="$HOME/.dependency-check-data" \
            -DossindexAnalyzerEnabled=false \
            -Dformats=HTML,JSON

      # Se guarda incluso si el análisis ha fallado o se ha quedado sin tiempo: lo
      # que se conserva es el trabajo de descarga, no el resultado. Mientras la
      # base no esté completa, cada lunes avanza un trozo y el run siguiente
      # continúa; cuando ya lo esté, esto pasa a costar segundos.
      - name: Guardar la base de datos de la NVD
        if: always() && steps.clave.outputs.hay_clave == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-${{ github.run_id }}

      # Se sube siempre: el caso que más interesa leer es justo aquel en el que el
      # paso anterior ha fallado por encontrar un CVE con CVSS >= 7.
      - name: Guardar el informe
        if: always() && steps.clave.outputs.hay_clave == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
          retention-days: 30
          if-no-files-found: warn
