# Publica la demo (frontend real + API simulada en el navegador) en GitHub Pages.
# Requisito único: Settings → Pages → Source: "GitHub Actions".
#
# En los pull request solo se construye: así un fallo de build-demo.sh se ve antes
# de mergear, y no al desplegar. Publicar, solo desde main.
name: Demo en GitHub Pages

on:
  # Las dos listas de paths van repetidas a propósito: Actions no admite anclas YAML.
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'demo/**'
      - 'scripts/build-demo.sh'
      - '.github/workflows/demo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'demo/**'
      - 'scripts/build-demo.sh'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Los despliegues comparten cola; las builds de PR van aparte para no bloquearla.
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  # Un despliegue a medias deja la demo en un estado raro; una build de PR no.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar dist-demo/
        run: ./scripts/build-demo.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
