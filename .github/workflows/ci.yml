# Integración continua: en cada push y cada pull request a main se compilan y se
# ejecutan las pruebas del backend, y se comprueba que la imagen de producción
# sigue construyéndose.
#
# A diferencia de una máquina de desarrollo con Docker Desktop parado, el runner
# de GitHub trae Docker, así que aquí SÍ se ejecutan las pruebas de integración
# con Testcontainers (@Testcontainers(disabledWithoutDocker = true) las salta en
# local cuando no hay Docker, pero en CI no deben saltarse nunca).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lectura del repositorio: el workflow no publica nada.
permissions:
  contents: read

# Si se empujan varios commits seguidos, cancela los runs anteriores de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compilar + pruebas + empaquetar el jar ejecutable, que es lo que
      # acaba desplegándose. Un fallo al empaquetar también debe romper el build.
      - name: Compilar y pasar las pruebas
        working-directory: backend
        run: mvn -B verify

      # Las pruebas de integración se saltan solas si el runner no tuviera Docker;
      # eso dejaría el build en verde ocultando que no se han ejecutado.
      - name: Comprobar que no se ha saltado ninguna prueba
        working-directory: backend
        run: |
          if ! ls target/surefire-reports/*.xml > /dev/null 2>&1; then
            echo "::error::Surefire no ha dejado ningún informe: las pruebas no se han ejecutado."
            exit 1
          fi
          saltadas=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/*.xml \
            | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Pruebas saltadas: $saltadas"
          if [ "$saltadas" -ne 0 ]; then
            echo "::error::Se han saltado $saltadas pruebas; en CI deben ejecutarse todas."
            exit 1
          fi

      - name: Guardar los informes de Surefire si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # La API se simula dentro del navegador (e2e/tests/api-simulada.js),
      # así que este job no necesita backend ni base de datos.
      - name: Pasar las pruebas
        run: npx playwright test

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  scripts:
    name: Scripts de operación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Las copias de seguridad llevan datos de pacientes. La prueba usa dobles de
      # docker y rclone, pero cifra y descifra con el age de verdad.
      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # La cabecera y el pie se editan en plantillas/ y se copian a las 11 páginas.
      # Si alguien toca una página a mano o se olvida de regenerar, falla aquí.
      - name: Cabecera y pie al día con plantillas/
        run: node scripts/plantillas.mjs --comprobar

      - name: Probar plantillas.mjs
        run: bash scripts/tests/plantillas.test.sh

      - name: Probar backup-db.sh
        run: bash scripts/tests/backup-db.test.sh

      # Un volcado real de PostgreSQL, cifrado y restaurado en otro contenedor limpio.
      - name: Probar la restauración de una copia
        run: bash scripts/tests/restauracion.test.sh

  imagen:
    name: Imagen de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El Dockerfile de la raíz es el que usa el VPS (docker-compose.prod.yml):
      # empaqueta el frontend como recursos estáticos dentro del jar del backend.
      # URL_PUBLICA es la que pone docker-compose.prod.yml con el dominio real. Aquí se
      # usa un dominio de prueba para comprobar después que ha llegado a las páginas.
      - name: Construir la imagen combinada
        run: docker build --build-arg URL_PUBLICA=https://www.ejemplo.test -t dr-agramonte:ci .

      # Las pruebas del backend corren con JDK 21. Si la imagen ejecutara otra versión,
      # producción usaría un Java que el CI no ha probado nunca.
      - name: Comprobar que la imagen ejecuta el mismo Java que las pruebas
        run: |
          version=$(docker run --rm --entrypoint java dr-agramonte:ci -version 2>&1 | head -1)
          echo "$version"
          echo "$version" | grep -q 'version "21\.'

      # Si el COPY del frontend se rompiera, la imagen seguiría construyéndose
      # pero arrancaría sin web. Se comprueba que los estáticos están en el jar.
      - name: Comprobar que el frontend viaja dentro del jar
        run: |
          docker create --name comprobacion dr-agramonte:ci
          docker cp comprobacion:/app/app.jar app.jar
          docker rm comprobacion
          unzip -l app.jar | grep -q 'BOOT-INF/classes/static/index.html'

      # Las páginas del repositorio apuntan su canonical, el sitemap y robots.txt a la
      # demo de GitHub Pages. En la imagen de producción tienen que apuntar al dominio
      # real, o Google tomaría la demo por la web original.
      - name: Comprobar que canonical, sitemap y robots apuntan al dominio real
        run: |
          estaticos=BOOT-INF/classes/static
          unzip -p app.jar "$estaticos/index.html" | grep -q 'rel="canonical" href="https://www.ejemplo.test/"'
          unzip -p app.jar "$estaticos/sitemap.xml" | grep -q '<loc>https://www.ejemplo.test/</loc>'
          unzip -p app.jar "$estaticos/robots.txt" | grep -q '^Sitemap: https://www.ejemplo.test/sitemap.xml'
          if unzip -p app.jar "$estaticos/*.html" "$estaticos/sitemap.xml" "$estaticos/robots.txt" \
              | grep -q 'maragramonte.github.io/dr-agramonte/app'; then
            echo "Queda alguna URL de la demo en la imagen de producción" >&2
            exit 1
          fi
