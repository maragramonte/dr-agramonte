services:
  postgres:
    image: postgres:15
    container_name: agramonte_db
    environment:
      POSTGRES_DB: dr_agramonte  # Coincide con tu application.yml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 en el host evita choque con PostgreSQL instalado en Windows (puerto 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dr_agramonte"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    container_name: dr-agramonte-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: on-failure
    environment:
      # Sobrescribimos la URL de local a 'postgres' (nombre del servicio)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dr_agramonte
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32charsmin}
      APP_PROFILE: postgres
      CONTACT_INBOX: ${CONTACT_INBOX:-}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_NOTIFY_TO: ${TWILIO_NOTIFY_TO:-}
      TWILIO_CHANNEL: ${TWILIO_CHANNEL:-whatsapp}
      TWILIO_NOTIFY_PATIENTS: ${TWILIO_NOTIFY_PATIENTS:-true}
      TWILIO_REMINDER_HOURS: ${TWILIO_REMINDER_HOURS:-24}

  backend_mysql:
    profiles: ["mysql"]
    build: ./backend
    container_name: dr-agramonte-api-mysql
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dr_agramonte?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32charsmin}
      APP_PROFILE: mysql
      CONTACT_INBOX: ${CONTACT_INBOX:-}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_NOTIFY_TO: ${TWILIO_NOTIFY_TO:-}
      TWILIO_CHANNEL: ${TWILIO_CHANNEL:-whatsapp}
      TWILIO_NOTIFY_PATIENTS: ${TWILIO_NOTIFY_PATIENTS:-true}
      TWILIO_REMINDER_HOURS: ${TWILIO_REMINDER_HOURS:-24}

  frontend:
    image: nginx:alpine
    container_name: agramonte_web
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    container_name: agramonte_mysql
    environment:
      MYSQL_DATABASE: dr_agramonte
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  postgres_data:
  mysql_data: